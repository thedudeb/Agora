services:
  app:
    build: .
    command: npm run start
    env_file:
      - .env
    environment:
      AGORA_APP_HOST: 0.0.0.0
      AGORA_APP_PORT: 5174
    ports:
      - "5174:5174"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    command: npm run start:api
    env_file:
      - .env
    environment:
      AGORA_API_HOST: 0.0.0.0
      AGORA_API_PORT: 8787
      AGORA_DATA_DIR: /app/server/data
      AGORA_BACKUP_DIR: /app/server/data/backups
    ports:
      - "8787:8787"
    volumes:
      - agora-data:/app/server/data
    restart: unless-stopped

volumes:
  agora-data:

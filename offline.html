<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agora Offline</title>
    <meta name="theme-color" content="#245a58">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #24211d;
        background: #f6f5f0;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(520px, calc(100vw - 32px));
        padding: 24px;
        background: #ffffff;
        border: 1px solid #d8d4c8;
        border-radius: 8px;
        box-shadow: 0 16px 40px rgba(35, 31, 25, 0.08);
      }

      img {
        width: 48px;
        height: 48px;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 1.6rem;
      }

      p {
        margin: 0;
        color: #716c63;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./assets/agora-mark.svg" alt="">
      <h1>Agora is offline</h1>
      <p>The app shell is installed, but this page was not available in the local cache. Reconnect and reload to sync the latest workspace data.</p>
    </main>
  </body>
</html>

name: QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-qa:
    name: Release QA
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Show runtime
        run: |
          node --version
          npm --version
          google-chrome --version || chromium --version || chromium-browser --version

      - name: Run dependency audit
        run: npm run audit

      - name: Run release QA
        env:
          AGORA_GOLDEN_ARTIFACT_DIR: qa-artifacts/golden
          AGORA_GOLDEN_TIMEOUT_MS: "120000"
        run: npm run qa

      - name: Upload golden-path failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-path-failure-artifacts
          path: qa-artifacts
          if-no-files-found: ignore
